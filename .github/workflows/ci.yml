name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Unit, component and story tests (with coverage)
        run: npm run coverage
      - name: End-to-end tests
        run: npm run e2e
      - name: Build
        run: npm run build
